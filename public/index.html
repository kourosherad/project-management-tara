<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tara · Project Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: { DEFAULT: '#4f46e5', dark: '#3730a3' } } } }
    };
  </script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <div id="demoNotice" role="status" class="hidden bg-amber-100 text-amber-950 px-4 py-3 text-sm text-center">
    Temporary demo: projects, accounts and files stay in this browser. Other browsers have separate workspaces. Clearing site data removes your demo. Use sample data only.
  </div>

  <!-- ================= LOGIN ================= -->
  <div id="loginView" class="hidden min-h-screen flex items-center justify-center p-4">
    <form id="loginForm" class="bg-white w-full max-w-sm rounded-2xl shadow-xl p-8 space-y-5">
      <div class="text-center">
        <div class="text-3xl font-extrabold text-brand">Tara</div>
        <p class="text-sm text-slate-500 mt-1">Software Project Management</p>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Username</label>
        <input name="username" autocomplete="username" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-brand outline-none" required />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Password</label>
        <input name="password" type="password" autocomplete="current-password" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-brand outline-none" required />
      </div>
      <p id="loginError" class="text-sm text-red-600 hidden"></p>
      <button class="w-full bg-brand hover:bg-brand-dark text-white font-semibold rounded-lg py-2.5 transition">Sign in</button>
      <p class="text-xs text-center text-slate-500">Use the account supplied by your Tara administrator.</p>
    </form>
  </div>

  <!-- ================= APP ================= -->
  <div id="appView" class="hidden">
    <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
      <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
        <button onclick="App.goHome()" class="text-xl font-extrabold text-brand">Tara</button>
        <div class="flex items-center gap-3 text-sm">
          <span id="gitlabBadge" class="hidden px-2 py-0.5 rounded-full bg-orange-100 text-orange-700 text-xs">GitLab</span>
          <span id="aiBadge" class="hidden px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 text-xs">Claude AI</span>
          <span id="userName" class="text-slate-600"></span>
          <button onclick="App.openAccount()" class="text-slate-500 hover:text-brand" title="Account">⚙</button>
          <button onclick="App.logout()" class="text-slate-500 hover:text-red-600">Logout</button>
        </div>
      </div>
    </header>

    <main id="mainContent" class="max-w-7xl mx-auto px-4 py-6"></main>
  </div>

  <!-- Modal host -->
  <div id="modalRoot"></div>

  <script src="/js/demo.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
